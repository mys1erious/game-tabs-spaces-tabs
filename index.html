<!doctype html>
<html lang="en">
<head>

<title>Tabs, spaces, tabs</title>
<meta name="description" content="Indent every new line with the opposite of the line above: tab, space, tab, space. Miss once and the linter slaps the file.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.20/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.20/800.css">
<style>
  html, body { margin: 0; height: 100%; background: #06070b; overflow: hidden; overscroll-behavior: none; }

</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Tabs, spaces, tabs. A code file grows one line at a time. Indent each new line with the opposite of the line above. Tab key or the left half adds a tab, Space key or the right half adds a space. Two of the same in a row and the linter slaps the file."></canvas>
<button id="snd" type="button" tabindex="-1" aria-label="Toggle sound (M)">sound on</button>
<div id="live" class="sr" aria-live="polite"></div>
<script>
'use strict';
const Q = new URLSearchParams(location.search);

function drawMistake(v, far) {

    ctx.globalAlpha = on ? 1 : 0.35; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(px, py); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.strokeStyle = RED; ctx.globalAlpha = (1 - m / T_CUT) * 0.9; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc((ax + px) / 2, ay, U * (0.05 + m * 0.5), 0, 7); ctx.stroke(); ctx.restore();
    return;
  }

  plane(0, -b - 1);
  ctx.globalAlpha = sq; ctx.strokeStyle = RED; ctx.lineWidth = 8; ctx.beginPath(); ctx.roundRect(-12, -4, IND[k] * 100 + 24, 208, 20); ctx.stroke();
  plane(0, -b - 1);
  const s = SNIPS[snip[b]], x0 = codeX(b) * 100, x1 = x0 + s.length * CW * 100;
  ctx.lineWidth = 6; ctx.beginPath();
  for (let x = x0; x <= x1; x += 6) ctx.lineTo(x, 90 + Math.sin(x / 9) * 6);
  ctx.stroke();
  ctx.globalAlpha = 1; screen();
  // the linter's note, editor-tooltip style, above the line
  {
    const fs = Math.max(13, Math.min(U * 0.042, 40)), msg = `✕ expected ${NAME[k ^ 1]}, found ${NAME[k]}`, sub = v.cause === 'auto' ? 'auto-indent copied the line above' : '';
    P(0, -b - 1); let x = px, y = py - fs * 0.9;
    ctx.font = `800 ${fs}px ${FONT}`; const tw = Math.max(ctx.measureText(msg).width, sub ? ctx.measureText(sub).width * 0.8 : 0) + fs * 1.4, th = fs * (sub ? 2.9 : 1.9);
    x = Math.max(MARGIN, Math.min(x - fs * 0.5, W - MARGIN - tw));
    ctx.globalAlpha = ez((m - T_CUT - 0.1) / 0.2);
    ctx.fillStyle = '#171a23'; ctx.strokeStyle = RED; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(x, y - th, tw, th, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = RED; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(msg, x + fs * 0.7, y - th + fs * 0.95);
    if (sub) { ctx.font = `400 ${fs * 0.8}px ${FONT}`; ctx.fillStyle = '#aab2c3'; ctx.fillText(sub, x + fs * 0.7, y - th + fs * 2.05); }
    ctx.globalAlpha = 1; ctx.textBaseline = 'alphabetic';
  }

  P(4.2, -b - 0.2); const ix = Math.min(Math.max(px, W * 0.3), W * 0.7), iy = py, z = pz;
  const hs = Math.min(W * 0.0024, H * 0.0018);

    const a = ez((m - T_LIFT) / 0.3) * 0.8;
    ctx.save(); ctx.translate(ix, iy); ctx.rotate(-0.03); ctx.scale(hs, hs); ctx.filter = `blur(${Math.round(8 * hs)}px)`; ctx.globalAlpha = a * 0.42; ctx.fillStyle = '#ff2d55'; ctx.fill(GLOVE); ctx.restore();
  }
  // shadow, then the hand
  let hx, hy, ang, sc, sqx = 1, sqy = 1, al = 1;
  if (m >= T_IN && m < T_LIFT + 0.6) {
    if (m < T_WIND) {                    // comes in from above, winds up
      const e = eio((m - T_IN) / (T_WIND - T_IN - 0.15)), wob = Math.sin((m - T_IN) * 9) * 0.03 * e;
      hx = ix + W * 0.22 - W * 0.02 * e; hy = lerp(-H * 0.7, iy - H * 0.56, e); ang = 0.3 + wob; sc = 1.3;
    } else if (m < T_SLAP) {             // the strike
      const e = Math.pow(cl((m - T_WIND) / (T_SLAP - T_WIND)), 2.2);
      const at = (e) => [lerp(ix + W * 0.2, ix, e), lerp(iy - H * 0.56, iy, e), lerp(0.3, -0.03, e), lerp(1.3, 1, e)];
      [hx, hy, ang, sc] = at(e);

        const e2 = Math.pow(cl((m - g * 0.03 - T_WIND) / (T_SLAP - T_WIND)), 2.2); if (e2 <= 0) continue;
        const [gx, gy, ga, gs] = at(e2); ctx.save(); screen(); ctx.translate(gx, gy); ctx.rotate(ga); ctx.scale(hs * gs, hs * gs); ctx.globalAlpha = 0.1 * (4 - g); ctx.fillStyle = '#e9edf7'; ctx.fill(GLOVE); ctx.fill(CUFF); ctx.restore();

    } else {                             // lifts away

  }
}

function drawHUD(v, far) {
  const U = Math.min(W, H), m = v.miss, missed = m >= 0;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  // the line counter
  const cf = Math.min(U * 0.13, H * 0.075), cy = Math.max(16, H * 0.035) + cf * 0.85;
  const endA = missed ? ez((m - T_LINE) / 0.35) : 0;
  { const g = ctx.createLinearGradient(0, 0, 0, cy + cf * 1.3); g.addColorStop(0, 'rgba(6,7,11,.92)'); g.addColorStop(0.7, 'rgba(6,7,11,.6)'); g.addColorStop(1, 'rgba(6,7,11,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, cy + cf * 1.3); }
  ctx.globalAlpha = 1 - endA * 0.85;
  ctx.font = `800 ${cf}px ${FONT}`; ctx.fillStyle = missed ? RED : '#f2f4f8';
  ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 18;
  ctx.fillText(fmt(v.n), W / 2, cy);
  ctx.font = `400 ${cf * 0.26}px ${FONT}`; ctx.fillStyle = '#9aa2b5';
  ctx.fillText(v.n === 1 ? 'line' : 'lines', W / 2, cy + cf * 0.36);
  // chant: the word for the last input, while the pace is still human
  if (!missed && v.n > N0) {
    const rate = v.mode === 'play' ? R0 * Math.exp(K * v.u) : 0, kk = kind[v.n - 1], age = v.now - born[v.n - 1];
    const a = (v.mode === 'play' ? 1 - ez((rate - 9) / 6) : 1 - ez((age - 0.5) / 0.4));
    if (a > 0.01) {
      const sz = cf * 0.5 * (1 + 0.25 * Math.max(0, 1 - age / 0.12));
      ctx.globalAlpha = a; ctx.font = `800 ${sz}px ${FONT}`; ctx.fillStyle = COL[kk];

    }
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;

    const fs = Math.min(W * 0.066, H * 0.05), y = H * 0.8;
    const a = `${fmt(v.n)} lines.`, b = ' 1 error.';
    ctx.font = `800 ${fs}px ${FONT}`; const wa = ctx.measureText(a).width, wb = ctx.measureText(b).width;
    const g = ctx.createLinearGradient(0, y - fs * 3, 0, H); g.addColorStop(0, 'rgba(6,7,11,0)'); g.addColorStop(0.35, 'rgba(6,7,11,.86)'); g.addColorStop(1, 'rgba(6,7,11,.95)');
    ctx.globalAlpha = endA; ctx.fillStyle = g; ctx.fillRect(0, y - fs * 3, W, H);
    ctx.textAlign = 'left'; const x = (W - wa - wb) / 2;

    if (v.mode === 'game' && !CLEAN && m > T_AGAIN) { ctx.textAlign = 'center'; ctx.font = `400 ${fs * 0.42}px ${FONT}`; ctx.fillStyle = '#8b93a7'; ctx.globalAlpha = ez((m - T_AGAIN) / 0.4); ctx.fillText('tap, Tab or Space to go again', W / 2, y + fs * 1.4); }

// ---------- the game ----------
const win = (n) => 0.38 + 1.3 * Math.exp(-(n - N0) / 140);    // seconds before the editor auto-indents
const G = { state: 'ready', n: N0, nf: N0, clock: 0, deadline: 0, missAt: 0, bad: -1, cause: '' };
function reset() { for (let i = 0; i < N0; i++) { kind[i] = i % 2; born[i] = -1; } Object.assign(G, { state: 'ready', n: N0, nf: N0, bad: -1, cause: '' }); }
const live = document.getElementById('live');
function input(k, auto) {
  if (PLAY) return;
  audio();
  if (G.state === 'over') { if (G.clock - G.missAt > T_AGAIN - 0.3) reset(); return; }
  if (G.state === 'miss' || G.n >= MAXL) return;
  const i = G.n; kind[i] = k; born[i] = G.clock; G.n++;
  if (kind[i - 1] === k) {
    Object.assign(G, { state: 'miss', missAt: G.clock, bad: i, cause: auto ? 'auto' : '' });
    sfx('bonk'); live.textContent = `Line ${fmt(G.n)}: expected ${NAME[k ^ 1]}. ${fmt(G.n)} lines, 1 error.`;
  } else { G.state = 'run'; G.deadline = G.clock + win(G.n); sfx(k === TAB ? 'tab' : 'space'); }
}
addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === 'Tab' || k === ' ' || k === 'Spacebar') e.preventDefault();      // keep focus and scroll where they are
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (k === 'Tab' || k === 'ArrowLeft') input(TAB);
  else if (k === ' ' || k === 'Spacebar' || k === 'ArrowRight') input(SPACE);
  else if (k === 'Enter' && G.state === 'over') input(TAB);
  else if (k === 'm' || k === 'M') toggleSound();
});
cv.addEventListener('pointerdown', (e) => { e.preventDefault(); input(e.clientX < W / 2 ? TAB : SPACE); });
cv.addEventListener('contextmenu', (e) => e.preventDefault());

// ---------- sound, made here ----------
let AC = null, soundOn = true;
const sndBtn = document.getElementById('snd');
function toggleSound() { soundOn = !soundOn; sndBtn.textContent = soundOn ? 'sound on' : 'sound off'; }
sndBtn.addEventListener('click', () => { toggleSound(); sndBtn.blur(); });
if (CLEAN || PLAY) sndBtn.hidden = true;
function audio() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { AC = null; } }
function tone(f0, f1, dur, type, vol, at = 0) {
  const t = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, f, q, at = 0) {
  const t = AC.currentTime + at, len = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  const R = rng(9); for (let i = 0; i < len; i++) d[i] = (R() * 2 - 1) * Math.pow(1 - i / len, 3);
  const s = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q; g.gain.value = vol;
  s.connect(bp).connect(g).connect(AC.destination); s.start(t);

function sfx(name) {
  if (!AC || !soundOn) return;
  if (name === 'tab') tone(330, 250, 0.09, 'triangle', 0.22);
  else if (name === 'space') tone(660, 560, 0.06, 'sine', 0.18);
  else if (name === 'bonk') tone(140, 70, 0.3, 'square', 0.08);
  else if (name === 'whoosh') noise(0.28, 0.5, 900, 0.7);
  else if (name === 'slap') { noise(0.22, 2.2, 1800, 0.6); tone(110, 40, 0.25, 'sine', 0.6); }
}

// ---------- loop ----------
for (let i = 0; i < MAXL; i++) { kind[i] = i % 2; born[i] = tOf(i); }
const NBK = kind[NB - 1];
function playView(t) {
  if (t < T_MISS) { const nf = nAt(t); return { n: Math.floor(nf), nf, u: t, now: t, miss: -1, bad: -1, cause: '', mode: 'play' }; }
  kind[NB] = NBK; born[NB] = T_MISS;
  return { n: NB + 1, nf: NB + 1, u: T_MISS, now: t, miss: t - T_MISS, bad: NB, cause: '', mode: 'play' };
}
if (!PLAY) reset();
let start = null, last = 0, firedWhoosh = false, firedSlap = false;
window.__peek = () => ({ n: G.n, last: kind[G.n - 1], state: G.state, focus: document.activeElement === document.body });
function frame(now) {
  if (start === null) start = now;
  const T = (now - start) / 1000, dt = Math.min(0.1, T - last); last = T;
  let v;
  if (PLAY) v = playView(TFIX !== null ? TFIX : T % (T_END + 1));
  else {
    G.clock += dt;
    if (G.state === 'run' && G.clock > G.deadline) input(kind[G.n - 1], true);
    G.nf += (G.n - G.nf) * (1 - Math.exp(-dt * 6));
    const miss = G.state === 'miss' || G.state === 'over' ? G.clock - G.missAt : -1;
    if (miss >= 0 && miss > T_LINE) G.state = 'over';
    if (miss >= 0 && !firedWhoosh && miss > T_WIND) { firedWhoosh = true; sfx('whoosh'); }
    if (miss >= 0 && !firedSlap && miss > T_SLAP) { firedSlap = true; sfx('slap'); }
    if (miss < 0) firedWhoosh = firedSlap = false;
    v = { n: G.n, nf: G.nf, u: uOf(G.nf), now: G.clock, miss, bad: G.bad, cause: G.cause, mode: 'game' };
  }
  render(v);
  window.__ready = true;
  requestAnimationFrame(frame);
}
Promise.all([document.fonts.load(`400 20px ${FONT}`), document.fonts.load(`800 20px ${FONT}`), document.fonts.load(`italic 400 20px ${FONT}`)])
  .catch(() => {}).then(() => requestAnimationFrame(frame));
</script>
